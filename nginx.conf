server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Missing build assets must remain 404 instead of returning HTML.
    location /assets/ {
        try_files $uri =404;
    }

    # React Router handles /login, /settings and unknown application routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
